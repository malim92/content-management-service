spring:
  application:
    name: content-management-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cms}
    username: ${DB_USERNAME:cms}
    password: ${DB_PASSWORD:cms}
    hikari:
      # Read-heavy workload: pool sized around PostgreSQL max_connections.
      # A service with 10k reads/min (~167/s) does not need a huge pool;
      # each cached read costs no connection at all.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 2000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations
    open-in-view: false    # no lazy-loading outside transactions
    properties:
      hibernate:
        jdbc.batch_size: 50
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration

cms:
  cache:
    ttl-minutes: 10
    jitter-percent: 20

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true

logging:
  level:
    root: info
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    com.kairostek.cms.service.ContentCache: debug